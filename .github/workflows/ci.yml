name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run client:verify

  image:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    env:
      IMAGE: ghcr.io/${{ github.repository }}-container
    steps:
      - uses: actions/checkout@v7
      - name: Read commit info
        id: commit
        run: |
          {
            echo "message=$(git log -1 --format=%s)"
            echo "author=$(git log -1 --format=%an)"
            echo "date=$(git log -1 --format=%cI)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            GIT_COMMIT_HASH=${{ github.sha }}
            GIT_COMMIT_MESSAGE=${{ steps.commit.outputs.message }}
            GIT_COMMIT_AUTHOR=${{ steps.commit.outputs.author }}
            GIT_COMMIT_DATE=${{ steps.commit.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::notice::DEPLOY_HOOK_URL secret is not set, skipping deploy"
            exit 0
          fi
          image_url=$(jq -rn --arg v "$IMAGE:$GITHUB_SHA" '$v | @uri')
          status=$(curl --silent --show-error -o response.txt -w "%{http_code}" \
            -X POST "$DEPLOY_HOOK_URL&imgURL=$image_url")
          if [ "$status" -ge 300 ]; then
            echo "::error::Deploy hook answered $status for $IMAGE:$GITHUB_SHA: $(cat response.txt)"
            exit 1
          fi
          echo "Deploy triggered for $IMAGE:$GITHUB_SHA"
